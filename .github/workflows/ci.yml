name: CI

on:
  push:
  pull_request:

jobs:
  public-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --python 3.11 --frozen --extra dev
      - run: uv run python -m compileall -q src tests
      - run: uv build --wheel --out-dir dist
      - run: uv run python tests/verify_wheel_assets.py dist/webvideo_to_data-0.1.0-py3-none-any.whl
      - name: Run public tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -m "not acceptance and not private_video" -q -p no:cacheprovider
      - name: Run public tests (Ubuntu)
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: egl
        run: uv run pytest -m "not acceptance and not private_video" -q -p no:cacheprovider
      - run: git diff --check
