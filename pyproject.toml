[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webvideo-to-data"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python>=4.9,<5",
    "mujoco>=3.2,<4",
    "imageio>=2.34,<3",
    "imageio-ffmpeg>=0.5,<1",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
